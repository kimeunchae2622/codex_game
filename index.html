<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#090d18">
  <title>잊힌 종의 정원</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="잊힌 종의 정원 게임">
    <header>
      <div>
        <p class="eyebrow">ORIGINAL WEB METROIDVANIA</p>
        <h1>잊힌 종의 정원</h1>
      </div>
      <button id="soundButton" type="button" aria-pressed="false">소리 켜기</button>
    </header>

    <section class="frame">
      <canvas id="game" width="960" height="540" aria-label="게임 화면"></canvas>
      <div id="startScreen" class="overlay">
        <div class="title-mark">✦</div>
        <p class="kicker">메아리가 잠든 지하 정원</p>
        <h2>잊힌 종의 정원</h2>
        <p>세 개의 메아리 조각을 모아<br>침묵의 문 너머를 깨우세요.</p>
        <button id="startButton" type="button">정원으로 내려가기</button>
        <small>키보드 또는 아래 화면 버튼으로 플레이</small>
      </div>
      <div id="pauseScreen" class="overlay hidden">
        <p class="kicker">잠시 멈춤</p>
        <h2>정원은 기다립니다</h2>
        <button id="resumeButton" type="button">계속하기</button>
      </div>
      <div id="shopScreen" class="overlay shop-overlay hidden">
        <p class="kicker">뿌리 상인의 작업대</p>
        <h2>방랑자의 상점</h2>
        <p class="shop-wallet">보유 코인 <strong id="shopCoins">0</strong> ◈</p>
        <div class="shop-grid">
          <button type="button" data-shop-item="weapon">
            <span>새벽의 칼날</span><small>공격력 +1</small><b>8 ◈</b>
          </button>
          <button type="button" data-shop-item="armor">
            <span>이끼 갑옷</span><small>최대 체력 +2</small><b>10 ◈</b>
          </button>
          <button type="button" data-shop-item="doubleJump">
            <span>나방의 날개</span><small>공중에서 Z로 한 번 더 점프</small><b>12 ◈</b>
          </button>
          <button type="button" data-shop-item="bellKey">
            <span>종루의 열쇠</span><small>모든 기억과 장비가 필요합니다</small><b>6 ◈</b>
          </button>
        </div>
        <p id="shopMessage" class="shop-message">몬스터가 떨어뜨린 코인으로 장비를 준비하세요.</p>
        <button id="closeShopButton" class="shop-close" type="button">상점 나가기</button>
      </div>
      <div id="toast" role="status" aria-live="polite"></div>
    </section>

    <section class="controls" aria-label="조작법">
      <div><kbd>←</kbd><kbd>→</kbd><span>이동</span></div>
      <div><kbd>↑</kbd><kbd>↓</kbd><span>올려보기 · 숙이기</span></div>
      <div><kbd>Z</kbd><span>점프</span></div>
      <div><kbd>X</kbd><span>공격</span></div>
      <div><kbd>C</kbd><span>대시</span></div>
      <div><kbd>Esc</kbd><span>일시정지</span></div>
    </section>

    <section class="touch-controls" aria-label="화면 조작">
      <div class="touch-group movement">
        <button data-key="ArrowLeft" aria-label="왼쪽">←</button>
        <button data-key="ArrowDown" aria-label="아래">↓</button>
        <button data-key="ArrowRight" aria-label="오른쪽">→</button>
      </div>
      <div class="touch-group actions">
        <button data-key="KeyZ">Z<small>점프</small></button>
        <button data-key="KeyX">X<small>공격</small></button>
        <button data-key="KeyC">C<small>대시</small></button>
      </div>
    </section>

    <footer>새로고침해도 마지막 휴식 지점과 진행 상황이 저장됩니다.</footer>
  </main>
  <script src="game.js"></script>
</body>
</html>
